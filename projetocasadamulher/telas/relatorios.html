<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relat&oacute;rios - Casa da Mulher</title>
    <link rel="stylesheet" href="style.css?v=18">
    <link rel="stylesheet" href="relatorios.css?v=1">
    <script src="config.js" defer></script>
    <script src="auth.js?v=4" defer></script>
    <script src="app.js?v=18" defer></script>
    <script src="relatorios.js?v=2" defer></script>
</head>
<body class="soft-page">
    <main style="max-width: 1400px; margin: 0 auto; padding: 24px 20px;">
        <header class="soft-header">
            <div>
                <h1 class="soft-header-title">Casa da Mulher de Itaquaquecetuba</h1>
                <p class="soft-header-subtitle" id="relSubtitulo">Relat&oacute;rios</p>
            </div>
            <div class="soft-session-card" id="sessionCard">
                <div class="soft-clock session-trigger" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false" id="sessionTrigger">
                    <div id="currentDate"></div>
                    <div id="currentTime"></div>
                </div>
                <div class="session-dropdown" id="sessionDropdown">
                    <div class="session-user-name" id="sessionUserName">-</div>
                    <div class="session-user-role" id="sessionUserRole">-</div>
                    <div class="session-user-meta" id="sessionUserEmail">-</div>
                    <div class="session-user-meta" style="margin-top: 4px;">ID: <span id="sessionUserId">-</span></div>
                    <div class="session-actions">
                        <a class="soft-btn soft-btn-warning" href="painel.html" id="relVoltar" style="text-decoration:none; flex: 1; justify-content: center;">Voltar</a>
                        <button type="button" id="btnSair" class="soft-btn soft-btn-danger" style="flex: 1; justify-content: center;">Sair</button>
                    </div>
                </div>
            </div>
        </header>

        <div id="relVisao" class="rel-visao hidden"></div>
        <div id="mensagemRelatorios" aria-live="polite"></div>

        <section class="soft-card" style="width: 100%;">
            <h2 class="soft-card-title" id="relTitulo">Relat&oacute;rios</h2>
            <p class="rel-intro" id="relIntro"></p>
            <div class="rel-sub-tabs">
                <button type="button" class="rel-sub-tab active" data-aba="area" id="relAbaArea">Relat&oacute;rio Estat&iacute;stico/Geral</button>
                <button type="button" class="rel-sub-tab" data-aba="individual">Relat&oacute;rio individual da assistida</button>
            </div>

            <div data-painel="area">
                <div class="rel-filtros">
                    <div id="perArea" style="display: contents;"></div>
                    <div id="filtroArea" style="display: contents;"></div>
                    <div class="rel-filtros-acoes">
                        <button type="button" class="soft-btn soft-btn-primary" id="btnImprimirArea">Imprimir / salvar PDF</button>
                    </div>
                </div>
                <div id="saidaArea"><p class="rel-carregando">Carregando...</p></div>
            </div>

            <div data-painel="individual" hidden>
                <div class="rel-filtros">
                    <div class="soft-form-group" id="selAssistida" style="flex: 1; min-width: 280px;"></div>
                    <div id="perInd" style="display: contents;"></div>
                    <div class="soft-form-group hidden" id="grupoSigiloso">
                        <label>Conte&uacute;do sigiloso</label>
                        <span class="rel-check"><input type="checkbox" id="chkSigiloso"> <span id="rotuloSigiloso">Incluir</span></span>
                    </div>
                    <div class="rel-filtros-acoes">
                        <button type="button" class="soft-btn soft-btn-secondary hidden" id="btnDocExterno">Documento para outra institui&ccedil;&atilde;o</button>
                        <button type="button" class="soft-btn soft-btn-primary" id="btnImprimirInd">Imprimir / salvar PDF</button>
                    </div>
                </div>
                <div id="saidaInd"><p class="soft-empty-state">Escolha uma assistida.</p></div>
            </div>
        </section>
    </main>

    <div id="relModal" class="soft-modal hidden rel-nao-imprimir" role="dialog" aria-modal="true">
        <div class="soft-modal-content rel-modal" id="relModalConteudo"></div>
    </div>
    <div id="relDocImpressao"></div>
</body>
</html>
